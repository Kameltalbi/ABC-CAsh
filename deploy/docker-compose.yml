services:
  abc-cash-db:
    image: postgres:16-alpine
    container_name: abc-cash-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abc_cash}
      POSTGRES_USER: ${POSTGRES_USER:-abc_cash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans deploy/.env}
    volumes:
      - abc_cash_pgdata:/var/lib/postgresql/data
    networks:
      - abc-cash-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abc_cash} -d ${POSTGRES_DB:-abc_cash}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  abc-cash-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: abc-cash-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8081"
      HOST: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://abc-cash-db:5432/abc_cash}
      DATABASE_USER: ${DATABASE_USER:-abc_cash}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD manquant dans deploy/.env}
      DATABASE_DRIVER: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans deploy/.env}
      JWT_ISSUER: abc-cash
      JWT_AUDIENCE: abc-cash-app
      JWT_REALM: ABC Cash API
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      abc-cash-db:
        condition: service_healthy
    networks:
      - abc-cash-internal

volumes:
  abc_cash_pgdata:

networks:
  abc-cash-internal:
    driver: bridge
