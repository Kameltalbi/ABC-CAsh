services:
  abc-cash-db:
    image: postgres:16-alpine
    container_name: abc-cash-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abc_cash}
      POSTGRES_USER: ${POSTGRES_USER:-abc_cash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - abc_cash_pgdata:/var/lib/postgresql/data
    networks:
      - abc-cash-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abc_cash} -d ${POSTGRES_DB:-abc_cash}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  abc-cash-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: abc-cash-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8081"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      abc-cash-db:
        condition: service_healthy
    networks:
      - abc-cash-internal

volumes:
  abc_cash_pgdata:

networks:
  abc-cash-internal:
    driver: bridge
